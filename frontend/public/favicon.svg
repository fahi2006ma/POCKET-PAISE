<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184e3d"/>
      <stop offset="100%" stop-color="#0c261e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Outer Lotus Petals -->
  <path d="M50 20 C42 35 30 46 22 56 C34 58 45 52 50 42 C55 52 66 58 78 56 C70 46 58 35 50 20 Z" fill="url(#petalGrad)" opacity="0.85"/>
  <path d="M50 25 C45 36 38 45 32 52 C40 54 46 50 50 42 C54 50 60 54 68 52 C62 45 55 36 50 25 Z" fill="#a7f3d0" opacity="0.6"/>
  
  <!-- Coin Base in Center -->
  <circle cx="50" cy="58" r="22" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="58" r="19" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  
  <!-- Indian Rupee Symbol ₹ -->
  <text x="50" y="65" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">₹</text>

  <!-- Sparkles -->
  <path d="M78 22 Q78 28 84 28 Q78 28 78 34 Q78 28 72 28 Q78 28 78 22 Z" fill="#fde68a"/>
  <path d="M22 26 Q22 30 26 30 Q22 30 22 34 Q22 30 18 30 Q22 30 22 26 Z" fill="#6ee7b7"/>
  <circle cx="50" cy="14" r="2.5" fill="#fef08a"/>
</svg>
